<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHLEO - Eskaintzak</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
    header { background: #ffffff; border-bottom: 1px solid #ddd; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header img { height: 40px; }
    nav { background: #0f4c81; padding: 10px 20px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
    .grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: white; border: 1px solid #e63946; padding: 15px; width: 30%; box-sizing: border-box; text-align: center; position: relative; }
    .badge { background: #e63946; color: white; padding: 3px 8px; font-size: 0.8em; font-weight: bold; position: absolute; top: 10px; right: 10px; }
    .price { font-size: 1.2em; color: #e63946; font-weight: bold; }
    .old-price { text-decoration: line-through; color: #888; font-size: 0.9em; margin-right: 5px; }
    .btn { display: inline-block; background: #e63946; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; margin-top: 10px; }
    footer { background: #222; color: white; text-align: center; padding: 20px; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <a href="hasiera_home.html">
      <img src="Athleo.png" alt="ATHLEO Logo">
    </a>
    <div>
      <input type="text" placeholder="Eskaintzak bilatu...">
      <button>Bilatu</button>
      <a href="#" style="margin-left: 15px;">🛒 Saskia (0)</a>
    </div>
  </header>

  <nav>
    <a href="index.html">Hasiera</a>
    <a href="kirolak_deportes.html">Kirolak</a>
    <a href="gizona_hombre.html">Gizona</a>
    <a href="emakumea_mujer.html">Emakumea</a>
    <a href="haurrak_ni_os.html">Haurrak</a>
    <a href="eskaintzak_ofertas.html">Eskaintzak</a>
  </nav>

  <main class="container">
    <h1>Eskaintza Bereziak eta Deskontuak</h1>
    <p>Aprobetxatu epe mugatuko prezio hauek:</p>

    <div class="grid">
      <div class="card">
        <span class="badge">-%30</span>
        <h3>Korrika Zapatillak</h3>
        <img src="zapas_oferta.jpg" alt="Korrika Zapatillak" style="width:80%; height:auto;">
        <p><span class="old-price">99,99 €</span> <span class="price">69,99 €</span></p>
        <button class="btn">Erosi</button>
      </div>
      <div class="card">
        <span class="badge">-%50</span>
        <h3>Kirol Erlojua</h3>
        <img src="reloj_deportivo.png" alt="Kirol Erlojua" style="width:80%; height:auto;"> 
        <p><span class="old-price">99,99 €</span> <span class="price">49,99 €</span></p>
        <button class="btn">Erosi</button>
      </div>
      <div class="card">
        <span class="badge">-%20</span>
        <h3>Kirol Poltsa</h3>
        <img src="bolsa_deportiva.jpg" alt="Kirol Poltsa" style="width:80%; height:auto;">
        <p><span class="old-price">29,99 €</span> <span class="price">23,99 €</span></p>
        <button class="btn">Erosi</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ATHLEO - Eskaintzak eta Promozioak</p>
  </footer>

</body>
</html>
