<!DOCTYPE html>

    nav a:hover { text-decoration: underline; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
    .grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: white; border: 1px solid #ddd; padding: 15px; width: 30%; box-sizing: border-box; text-align: center; }
    .price { font-size: 1.2em; color: #0f4c81; font-weight: bold; }
    .btn { display: inline-block; background: #0f4c81; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; margin-top: 10px; }

  <header>
    <a href="hasiera_home.html">
